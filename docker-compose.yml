version: '3'
services:
  quant-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-streamlit
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    command: /app/run_server.sh
    environment:
      VIRTUAL_HOST: quant.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: quant.gnps2.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com
      ENVIRONMENT_MODE: gnps
    ports:
    - "8007:5000"

networks:
  nginx-net:
    external:
      name: nginx-net